name: Process ATIS

on:
  workflow_run:
    workflows: ["Record ATIS Audio"]
    types:
      - completed
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installation de Groq pour l'IA et faster-whisper pour la transcription audio locale
          pip install groq faster-whisper

      - name: Run ATIS Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          # Le commit se fait seulement si le fichier a été modifié par le script
          git commit -m "Update ATIS Dashboard via Groq/Whisper: $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git push
