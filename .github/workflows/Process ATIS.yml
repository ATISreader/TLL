name: Process ATIS

on:
  workflow_run:
    workflows: ["Record ATIS Audio"]
    types: - completed
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install groq faster-whisper

      - name: Run ATIS Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git commit -m "Update ATIS Dashboard via Groq/Whisper: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
